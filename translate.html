<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translate — Text &amp; Voice</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --ink: #e2e8f0;
    --muted: #94a3b8;
    --line: #334155;
    --brand: #6366f1;
    --brand-2: #818cf8;
    --ok: #34d399;
    --err: #f87171;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, #0f172a 55%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 18px 48px;
  }

  header.app { text-align: center; margin-bottom: 22px; }
  header.app h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: .3px;
    background: linear-gradient(90deg, var(--brand-2), #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header.app p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  .translator {
    width: 100%;
    max-width: 1080px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 14px;
    align-items: stretch;
  }

  .panel {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 320px;
    box-shadow: 0 18px 40px rgba(0,0,0,.28);
  }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    background: rgba(15,23,42,.35);
  }

  select.lang {
    flex: 1;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 10px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    outline: none;
  }
  select.lang:focus { border-color: var(--brand); }

  .icon-btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    width: 38px;
    height: 38px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: .15s;
    flex: 0 0 auto;
    font-size: 16px;
  }
  .icon-btn:hover { border-color: var(--brand); color: var(--brand-2); }
  .icon-btn.speaking { border-color: var(--ok); color: var(--ok); }
  .icon-btn:disabled { opacity: .4; cursor: not-allowed; }

  textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 18px;
    line-height: 1.6;
    padding: 16px;
    min-height: 200px;
  }
  textarea::placeholder { color: #64748b; }
  #output { color: #d1fae5; }

  .panel-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
    min-height: 38px;
  }
  .detected { color: var(--ok); }
  .status.err { color: var(--err); }

  .swap-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .swap {
    width: 46px; height: 46px;
    border-radius: 50%;
    font-size: 18px;
    background: var(--panel-2);
  }
  .swap:hover { transform: rotate(180deg); border-color: var(--brand); }

  .actions {
    width: 100%;
    max-width: 1080px;
    margin-top: 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 11px 22px;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
  }
  .btn:hover { border-color: var(--brand); color: var(--brand-2); }
  .btn.primary {
    background: linear-gradient(90deg, var(--brand), #4f46e5);
    border-color: transparent;
    color: #fff;
    min-width: 160px;
  }
  .btn.primary:hover { filter: brightness(1.1); color: #fff; }
  .btn:disabled { opacity: .55; cursor: progress; }
  .auto { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; user-select: none; cursor: pointer; }
  .auto input { accent-color: var(--brand); width: 16px; height: 16px; }

  .spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translate(-50%, 20px);
    background: #111827;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    font-size: 14px;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 760px) {
    .translator { grid-template-columns: 1fr; }
    .swap:hover { transform: rotate(90deg); }
  }
</style>
</head>
<body>

<header class="app">
  <h1>Translate</h1>
  <p>Translate text between languages and hear it spoken aloud</p>
</header>

<div class="translator">
  <section class="panel">
    <div class="panel-head">
      <select class="lang" id="sourceLang"></select>
      <button class="icon-btn" id="speakSource" title="Listen to source">&#128264;</button>
      <button class="icon-btn" id="copySource" title="Copy source">&#128203;</button>
    </div>
    <textarea id="input" placeholder="Type or paste text here…" maxlength="5000"></textarea>
    <div class="panel-foot">
      <span id="detected" class="detected"></span>
      <span id="count">0 / 5000</span>
    </div>
  </section>

  <div class="swap-wrap">
    <button class="swap icon-btn" id="swap" title="Swap languages">&#8646;</button>
  </div>

  <section class="panel">
    <div class="panel-head">
      <select class="lang" id="targetLang"></select>
      <button class="icon-btn" id="speakTarget" title="Voiceover translation">&#128264;</button>
      <button class="icon-btn" id="copyTarget" title="Copy translation">&#128203;</button>
    </div>
    <textarea id="output" placeholder="Translation appears here…" readonly></textarea>
    <div class="panel-foot">
      <span id="status" class="status"></span>
      <span id="countOut">0 characters</span>
    </div>
  </section>
</div>

<div class="actions">
  <button class="btn primary" id="translateBtn">Translate</button>
  <button class="btn" id="clearBtn">Clear</button>
  <label class="auto"><input type="checkbox" id="autoTranslate" checked> Auto-translate while typing</label>
</div>

<div class="toast" id="toast"></div>

<script>
/* ------------------------------------------------------------------ *
 *  Language catalogue (translation code / speech BCP-47 locale)
 * ------------------------------------------------------------------ */
const LANGUAGES = [
  { code: "auto",   label: "Auto Detect",            speech: "en-US" },
  { code: "af",     label: "Afrikaans",              speech: "af-ZA" },
  { code: "ar",     label: "Arabic",                 speech: "ar-SA" },
  { code: "bn",     label: "Bengali",                speech: "bn-IN" },
  { code: "bg",     label: "Bulgarian",              speech: "bg-BG" },
  { code: "ca",     label: "Catalan",                speech: "ca-ES" },
  { code: "zh-CN",  label: "Chinese (Simplified)",   speech: "zh-CN" },
  { code: "zh-TW",  label: "Chinese (Traditional)",  speech: "zh-TW" },
  { code: "hr",     label: "Croatian",               speech: "hr-HR" },
  { code: "cs",     label: "Czech",                  speech: "cs-CZ" },
  { code: "da",     label: "Danish",                 speech: "da-DK" },
  { code: "nl",     label: "Dutch",                  speech: "nl-NL" },
  { code: "en",     label: "English",                speech: "en-US" },
  { code: "et",     label: "Estonian",               speech: "et-EE" },
  { code: "fi",     label: "Finnish",                speech: "fi-FI" },
  { code: "fr",     label: "French",                 speech: "fr-FR" },
  { code: "de",     label: "German",                 speech: "de-DE" },
  { code: "el",     label: "Greek",                  speech: "el-GR" },
  { code: "gu",     label: "Gujarati",               speech: "gu-IN" },
  { code: "he",     label: "Hebrew",                 speech: "he-IL" },
  { code: "hi",     label: "Hindi",                  speech: "hi-IN" },
  { code: "hu",     label: "Hungarian",              speech: "hu-HU" },
  { code: "id",     label: "Indonesian",             speech: "id-ID" },
  { code: "it",     label: "Italian",                speech: "it-IT" },
  { code: "ja",     label: "Japanese",               speech: "ja-JP" },
  { code: "kn",     label: "Kannada",                speech: "kn-IN" },
  { code: "ko",     label: "Korean",                 speech: "ko-KR" },
  { code: "lv",     label: "Latvian",                speech: "lv-LV" },
  { code: "lt",     label: "Lithuanian",             speech: "lt-LT" },
  { code: "ml",     label: "Malayalam",              speech: "ml-IN" },
  { code: "mr",     label: "Marathi",                speech: "mr-IN" },
  { code: "ms",     label: "Malay",                  speech: "ms-MY" },
  { code: "no",     label: "Norwegian",              speech: "nb-NO" },
  { code: "fa",     label: "Persian",                speech: "fa-IR" },
  { code: "pl",     label: "Polish",                 speech: "pl-PL" },
  { code: "pt",     label: "Portuguese",             speech: "pt-PT" },
  { code: "pa",     label: "Punjabi",                speech: "pa-IN" },
  { code: "ro",     label: "Romanian",               speech: "ro-RO" },
  { code: "ru",     label: "Russian",                speech: "ru-RU" },
  { code: "sr",     label: "Serbian",                speech: "sr-RS" },
  { code: "sk",     label: "Slovak",                 speech: "sk-SK" },
  { code: "sl",     label: "Slovenian",              speech: "sl-SI" },
  { code: "es",     label: "Spanish",                speech: "es-ES" },
  { code: "sw",     label: "Swahili",                speech: "sw-KE" },
  { code: "sv",     label: "Swedish",                speech: "sv-SE" },
  { code: "ta",     label: "Tamil",                  speech: "ta-IN" },
  { code: "te",     label: "Telugu",                 speech: "te-IN" },
  { code: "th",     label: "Thai",                   speech: "th-TH" },
  { code: "tr",     label: "Turkish",                speech: "tr-TR" },
  { code: "uk",     label: "Ukrainian",              speech: "uk-UA" },
  { code: "ur",     label: "Urdu",                   speech: "ur-PK" },
  { code: "vi",     label: "Vietnamese",             speech: "vi-VN" },
  { code: "cy",     label: "Welsh",                  speech: "cy-GB" },
];

const langByCode = Object.fromEntries(LANGUAGES.map(l => [l.code, l]));

/* ------------------------------------------------------------------ *
 *  DOM refs
 * ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const sourceSel = $("sourceLang");
const targetSel = $("targetLang");
const inputEl   = $("input");
const outputEl  = $("output");
const statusEl  = $("status");
const detectedEl= $("detected");
const countEl   = $("count");
const countOut  = $("countOut");
const translateBtn = $("translateBtn");
const toastEl   = $("toast");

/* ------------------------------------------------------------------ *
 *  Populate selects
 * ------------------------------------------------------------------ */
function fillSelect(sel, includeAuto) {
  sel.innerHTML = "";
  LANGUAGES.filter(l => includeAuto || l.code !== "auto").forEach(l => {
    const opt = document.createElement("option");
    opt.value = l.code;
    opt.textContent = l.label;
    sel.appendChild(opt);
  });
}
fillSelect(sourceSel, true);
fillSelect(targetSel, false);
sourceSel.value = "en";
targetSel.value = "es";

/* ------------------------------------------------------------------ *
 *  Translation backends
 * ------------------------------------------------------------------ */
async function googleTranslate(text, from, to) {
  const url = "https://translate.googleapis.com/translate_a/single"
    + `?client=gtx&sl=${encodeURIComponent(from)}&tl=${encodeURIComponent(to)}`
    + `&dt=t&q=${encodeURIComponent(text)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Google endpoint failed");
  const data = await res.json();
  const translated = (data[0] || []).map(seg => (seg && seg[0]) || "").join("");
  const detected = data[2] || (from === "auto" ? "en" : from);
  if (!translated) throw new Error("Empty translation");
  return { translated, detected };
}

async function myMemoryTranslate(text, from, to) {
  const src = from === "auto" ? "en" : from;
  const url = "https://api.mymemory.translated.net/get"
    + `?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(src + "|" + to)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("MyMemory endpoint failed");
  const data = await res.json();
  const translated = data && data.responseData && data.responseData.translatedText;
  if (!translated) throw new Error("Empty translation");
  return { translated, detected: src };
}

async function translate(text, from, to) {
  try {
    return await googleTranslate(text, from, to);
  } catch (e) {
    return await myMemoryTranslate(text, from, to);
  }
}

/* ------------------------------------------------------------------ *
 *  Main translation flow
 * ------------------------------------------------------------------ */
let requestId = 0;

async function runTranslation() {
  const text = inputEl.value.trim();
  const from = sourceSel.value;
  const to = targetSel.value;

  clearStatus();
  detectedEl.textContent = "";

  if (!text) {
    outputEl.value = "";
    countOut.textContent = "0 characters";
    return;
  }
  if (from === to) {
    outputEl.value = text;
    updateOutCount();
    return;
  }

  const myId = ++requestId;
  setLoading(true);

  try {
    const { translated, detected } = await translate(text, from, to);
    if (myId !== requestId) return; // stale response
    outputEl.value = translated;
    updateOutCount();
    if (from === "auto" && detected) {
      const d = langByCode[detected];
      detectedEl.textContent = "Detected: " + (d ? d.label : detected);
    }
  } catch (err) {
    if (myId !== requestId) return;
    setStatus("Translation failed. Check your connection and try again.", true);
  } finally {
    if (myId === requestId) setLoading(false);
  }
}

function setLoading(on) {
  translateBtn.disabled = on;
  translateBtn.innerHTML = on
    ? '<span class="spinner"></span> Translating…'
    : "Translate";
  if (on) setStatus("Translating…", false);
  else if (!statusEl.classList.contains("err") && statusEl.textContent === "Translating…") {
    clearStatus();
  }
}
function setStatus(msg, isErr) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("err", !!isErr);
}
function clearStatus() {
  statusEl.textContent = "";
  statusEl.classList.remove("err");
}
function updateOutCount() {
  countOut.textContent = outputEl.value.length + " characters";
}

/* ------------------------------------------------------------------ *
 *  Speech / voiceover (Web Speech API)
 * ------------------------------------------------------------------ */
let voices = [];
function loadVoices() {
  voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
}
if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice(locale) {
  if (!voices.length) loadVoices();
  const exact = voices.find(v => v.lang && v.lang.toLowerCase() === locale.toLowerCase());
  if (exact) return exact;
  const base = locale.split("-")[0].toLowerCase();
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith(base)) || null;
}

function speak(text, locale, btn) {
  if (!("speechSynthesis" in window)) {
    toast("Speech synthesis is not supported in this browser.");
    return;
  }
  const clean = (text || "").trim();
  if (!clean) return;
  if (clean.length > 5000) {
    toast("Text too long to speak. Select a shorter passage.");
    return;
  }

  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(clean);
  const voice = pickVoice(locale);
  if (voice) {
    utter.voice = voice;
    utter.lang = voice.lang;
  } else {
    utter.lang = locale;
  }
  utter.rate = 1;
  utter.pitch = 1;

  if (btn) {
    btn.classList.add("speaking");
    const done = () => btn.classList.remove("speaking");
    utter.onend = done;
    utter.onerror = done;
  }
  speechSynthesis.speak(utter);
}

/* ------------------------------------------------------------------ *
 *  Events
 * ------------------------------------------------------------------ */
translateBtn.addEventListener("click", runTranslation);

$("speakTarget").addEventListener("click", e => {
  const locale = (langByCode[targetSel.value] || {}).speech || "en-US";
  speak(outputEl.value, locale, e.currentTarget);
});

$("speakSource").addEventListener("click", e => {
  let code = sourceSel.value;
  if (code === "auto") {
    // best guess: use detected language if available
    const m = detectedEl.textContent.match(/^Detected:\s*(.+)$/);
    if (m) {
      const found = LANGUAGES.find(l => l.label === m[1]);
      if (found) code = found.code;
    }
    if (code === "auto") code = "en";
  }
  const locale = (langByCode[code] || {}).speech || "en-US";
  speak(inputEl.value, locale, e.currentTarget);
});

$("swap").addEventListener("click", () => {
  const from = sourceSel.value;
  const to = targetSel.value;
  if (from === "auto") {
    toast("Pick a specific source language before swapping.");
    return;
  }
  sourceSel.value = to;
  targetSel.value = from === to ? (to === "en" ? "es" : "en") : from;
  const srcText = inputEl.value;
  inputEl.value = outputEl.value;
  outputEl.value = srcText;
  updateCounts();
  if (inputEl.value.trim()) runTranslation();
});

$("clearBtn").addEventListener("click", () => {
  inputEl.value = "";
  outputEl.value = "";
  detectedEl.textContent = "";
  clearStatus();
  updateCounts();
  speechSynthesis && speechSynthesis.cancel();
});

$("copySource").addEventListener("click", () => copy(inputEl.value, "Source text copied"));
$("copyTarget").addEventListener("click", () => copy(outputEl.value, "Translation copied"));

function copy(text, msg) {
  if (!text.trim()) return;
  navigator.clipboard.writeText(text).then(
    () => toast(msg),
    () => toast("Copy failed")
  );
}

let debounce;
inputEl.addEventListener("input", () => {
  updateCounts();
  if (!$("autoTranslate").checked) return;
  clearTimeout(debounce);
  debounce = setTimeout(runTranslation, 650);
});
inputEl.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    runTranslation();
  }
});

sourceSel.addEventListener("change", () => { if (inputEl.value.trim()) runTranslation(); });
targetSel.addEventListener("change", () => { if (inputEl.value.trim()) runTranslation(); });

function updateCounts() {
  countEl.textContent = inputEl.value.length + " / 5000";
  updateOutCount();
}

let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

/* warm-up */
updateCounts();
</script>
</body>
</html>
